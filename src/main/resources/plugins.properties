# Registro de plugins del microkernel (HU03 - Validacion estructural).
# Formato: nombre-logico=FQCN-de-la-clase-del-plugin
# PluginLoader instancia cada clase por reflexion (Class.forName + constructor
# sin argumentos) y la registra en QuestionMicrokernel. Agregar un nuevo tipo
# de pregunta solo requiere una linea aqui, sin tocar el nucleo (RNF-13/RNF-14).
multiple-choice=co.edu.unicauca.bancopreguntas.microkernel.plugins.MultipleChoiceQuestionPlugin
case-study=co.edu.unicauca.bancopreguntas.microkernel.plugins.CaseQuestionPlugin
multimedia=co.edu.unicauca.bancopreguntas.microkernel.plugins.MultimediaQuestionPlugin
excel-import=co.edu.unicauca.bancopreguntas.microkernel.plugins.ExcelImportQuestionPlugin
